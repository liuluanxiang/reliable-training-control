<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Paper 1 实验监控</title>
  <style>
    :root{--bg:#f4f6f8;--surface:#fff;--ink:#17212b;--muted:#637083;--line:#d9e0e7;--teal:#087f72;--blue:#2563eb;--green:#138a56;--amber:#b96305;--red:#c53232;--track:#e8edf2}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.42 system-ui,-apple-system,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--line);padding:11px 18px;display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:18px;margin:0;letter-spacing:0}.header-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tag{border:1px solid var(--line);padding:3px 8px;border-radius:999px;color:var(--muted);background:#f8fafb}.dot{width:8px;height:8px;border-radius:50%;background:var(--amber);display:inline-block;margin-right:5px}.dot.running{background:var(--green);box-shadow:0 0 0 3px #138a5620}.dot.attention{background:var(--red)}main{max-width:1780px;margin:auto;padding:14px 18px 28px}.summary{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:9px}.metric,.section{background:var(--surface);border:1px solid var(--line);border-radius:6px}.metric{padding:10px;min-width:0}.label{font-size:11px;color:var(--muted);margin-bottom:3px}.value{font-size:19px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0}.detail{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar{height:7px;background:var(--track);overflow:hidden;border-radius:4px;margin-top:7px}.fill{height:100%;background:var(--teal);width:0;transition:width .3s}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:10px;margin-top:10px}.section{padding:11px;min-width:0}.section.full{grid-column:1/-1}.section h2{font-size:13px;margin:0 0 9px;letter-spacing:0}.current-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.kv{border-left:3px solid var(--line);padding:4px 7px;min-width:0}.kv strong{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kv.active{border-left-color:var(--blue)}.group-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.group{border:1px solid var(--line);border-radius:5px;padding:8px}.group-head{display:flex;justify-content:space-between;font-weight:700}.group-counts{font-size:11px;color:var(--muted);margin-top:5px}.gpu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.gpu .kv{border-left-color:var(--amber)}.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chart{width:100%;height:180px;border:1px solid var(--line);border-radius:5px;background:#fbfcfd}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}input,select{height:30px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);padding:0 8px;font:inherit}input{min-width:230px}.table-wrap{max-height:470px;overflow:auto;border:1px solid var(--line);border-radius:5px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#f2f5f7;color:var(--muted);z-index:1}.s-RUNNING{color:var(--blue);font-weight:700}.s-COMPLETED{color:var(--green);font-weight:700}.s-FAILED{color:var(--red);font-weight:700}.s-PENDING{color:var(--muted)}.logs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.log{height:330px;overflow:auto;margin:0;background:#101820;color:#d8e1e8;border-radius:5px;padding:9px;font:11px/1.45 Consolas,monospace;white-space:pre-wrap;word-break:break-word}.error-log{color:#ffc1bd}.path{font-family:Consolas,monospace;max-width:440px;overflow:hidden;text-overflow:ellipsis}.stale{color:var(--red)}@media(max-width:1200px){.summary{grid-template-columns:repeat(4,1fr)}.layout{grid-template-columns:1fr}.section.full{grid-column:auto}.current-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){header{align-items:flex-start;flex-direction:column}.summary{grid-template-columns:repeat(2,1fr)}.current-grid,.group-grid,.gpu{grid-template-columns:repeat(2,1fr)}.chart-grid,.logs{grid-template-columns:1fr}main{padding:10px}.value{font-size:17px}}
  </style>
</head>
<body>
<header><div><h1>Paper 1 修订实验实时监控</h1><div class="detail" id="subtitle">等待实验状态</div></div><div class="header-meta"><span class="tag"><span class="dot" id="dot"></span><span id="status">连接中</span></span><span class="tag" id="updated">-</span><span class="tag">2 秒刷新</span></div></header>
<main>
  <section class="summary">
    <div class="metric"><div class="label">正式队列</div><div class="value" id="queueCount">0 / 0</div><div class="bar"><div class="fill" id="overallBar"></div></div></div>
    <div class="metric"><div class="label">当前任务</div><div class="value" id="runIndex">-</div><div class="detail" id="runGroup">-</div></div>
    <div class="metric"><div class="label">Epoch</div><div class="value" id="epoch">-</div><div class="bar"><div class="fill" id="epochBar"></div></div></div>
    <div class="metric"><div class="label">Batch</div><div class="value" id="batch">-</div><div class="bar"><div class="fill" id="batchBar"></div></div></div>
    <div class="metric"><div class="label">当前运行 ETA</div><div class="value" id="runEta">-</div><div class="detail" id="epochTime">-</div></div>
    <div class="metric"><div class="label">剩余 GPU 时间</div><div class="value" id="gpuHours">-</div><div class="detail" id="completion">-</div></div>
    <div class="metric"><div class="label">失败</div><div class="value" id="failed">0</div><div class="detail" id="pending">-</div></div>
    <div class="metric"><div class="label">GPU 利用率</div><div class="value" id="gpuUtil">-</div><div class="bar"><div class="fill" id="gpuBar"></div></div></div>
  </section>

  <div class="layout">
    <section class="section"><h2>当前运行</h2><div class="current-grid" id="currentGrid"></div></section>
    <section class="section"><h2>GPU 遥测</h2><div class="gpu" id="gpuGrid"></div></section>
    <section class="section"><h2>实验分组</h2><div class="group-grid" id="groups"></div></section>
    <section class="section"><h2>最新指标</h2><div class="current-grid" id="metrics"></div></section>
    <section class="section full"><h2>当前运行轨迹</h2><div class="chart-grid"><canvas class="chart" id="accChart"></canvas><canvas class="chart" id="lossChart"></canvas></div></section>
    <section class="section full"><h2>260-run 正式队列</h2><div class="toolbar"><input id="search" placeholder="搜索数据集、模型、方法、seed"><select id="groupFilter"><option value="">全部分组</option></select><select id="statusFilter"><option value="">全部状态</option><option>PENDING</option><option>RUNNING</option><option>COMPLETED</option><option>FAILED</option></select><span class="detail" id="visibleCount"></span></div><div class="table-wrap"><table><thead><tr><th>#</th><th>状态</th><th>分组</th><th>数据集</th><th>模型</th><th>方法</th><th>Seed</th><th>预算</th><th>最大 Epoch</th><th>输出目录</th></tr></thead><tbody id="queueBody"></tbody></table></div></section>
    <section class="section full"><h2>实时日志</h2><div class="logs"><pre class="log" id="currentLog"></pre><pre class="log error-log" id="queueLog"></pre></div></section>
  </div>
</main>
<script>
let latest={manifest:[]};const $=id=>document.getElementById(id);const n=(v,d=4)=>v===undefined||v===null||v===""?"-":Number.isFinite(Number(v))?Number(v).toLocaleString(undefined,{maximumFractionDigits:d}):v;const pct=(a,b)=>b?Math.max(0,Math.min(100,100*Number(a||0)/Number(b))):0;function bar(id,v){$(id).style.width=Math.max(0,Math.min(100,v))+"%"}function kv(label,value,active=false){return `<div class="kv ${active?'active':''}"><div class="label">${label}</div><strong title="${String(value??'-').replaceAll('"','&quot;')}">${value??'-'}</strong></div>`}
function parseEpochs(messages){const rows=[];for(const line of messages||[]){const m=line.match(/epoch=(\d+)\/\d+.*?val_acc=([\d.]+).*?val_nll=([\d.]+).*?rbar=([-\d.]+)/);if(m)rows.push({x:+m[1],acc:+m[2],loss:+m[3],r:+m[4]})}return rows}
function draw(id,series,title,colors){const c=$(id),dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,w,h);x.fillStyle='#637083';x.font='12px system-ui';x.fillText(title,10,17);const vals=series.flatMap(s=>s.values).filter(Number.isFinite);if(!vals.length){x.fillText('等待 epoch 指标',10,40);return}let lo=Math.min(...vals),hi=Math.max(...vals);if(hi===lo){hi+=1;lo-=1}const pad={l:42,r:12,t:28,b:24};x.strokeStyle='#d9e0e7';x.beginPath();x.moveTo(pad.l,pad.t);x.lineTo(pad.l,h-pad.b);x.lineTo(w-pad.r,h-pad.b);x.stroke();series.forEach((s,i)=>{x.strokeStyle=colors[i];x.lineWidth=2;x.beginPath();s.values.forEach((v,j)=>{const xx=pad.l+(w-pad.l-pad.r)*(j/Math.max(s.values.length-1,1));const yy=pad.t+(h-pad.t-pad.b)*(1-(v-lo)/(hi-lo));j?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke();x.fillStyle=colors[i];x.fillText(s.name,pad.l+i*105,h-6)});x.fillStyle='#637083';x.fillText(n(hi,3),3,pad.t+4);x.fillText(n(lo,3),3,h-pad.b)}
function renderQueue(){const q=($('search').value||'').toLowerCase(),g=$('groupFilter').value,s=$('statusFilter').value;const rows=(latest.manifest||[]).filter(r=>(!g||r.group===g)&&(!s||r.status===s)&&(!q||[r.dataset,r.model,r.method,r.seed,r.group].join(' ').toLowerCase().includes(q)));$('visibleCount').textContent=`显示 ${rows.length} / ${(latest.manifest||[]).length}`;$('queueBody').innerHTML=rows.map(r=>`<tr><td>${r.run_index}</td><td class="s-${r.status}">${r.status}</td><td>${r.group}</td><td>${r.dataset}</td><td>${r.model}</td><td>${r.method}</td><td>${r.seed}</td><td>${r.budget_mode}</td><td>${r.max_epochs}</td><td class="path" title="${r.output_dir}">${r.output_dir}</td></tr>`).join('')}
function render(d){latest=d;const c=d.current||{},cs=d.current_state||{},counts=d.counts||{},gpu=d.gpu||{},rt=d.runtime||{};$('dot').className='dot '+d.status;$('status').textContent=d.status;$('updated').textContent=new Date(d.generated_at).toLocaleString();$('subtitle').textContent=c.output_dir||'等待正式队列启动';$('queueCount').textContent=`${counts.COMPLETED||0} / ${d.total||0}`;bar('overallBar',100*(d.overall_fraction||0));$('runIndex').textContent=c.global_run_index?`${c.global_run_index} / ${c.global_total_runs}`:'-';$('runGroup').textContent=c.group||'-';$('epoch').textContent=c.epoch?`${c.epoch} / ${c.total_epochs}`:'-';bar('epochBar',pct(c.epoch,c.total_epochs));$('batch').textContent=c.batch?`${c.batch} / ${c.total_batches}`:'-';bar('batchBar',pct(c.batch,c.total_batches));$('runEta').textContent=c.eta_run||'-';$('epochTime').textContent=`epoch ${c.epoch_time||'-'} · avg ${c.avg_epoch_time||'-'}`;$('gpuHours').textContent=rt.remaining_gpu_hours==null?'-':`${n(rt.remaining_gpu_hours,1)} h`;$('completion').textContent=rt.continuous_completion?new Date(rt.continuous_completion).toLocaleString():'-';$('failed').textContent=counts.FAILED||0;$('pending').textContent=`待运行 ${counts.PENDING||0} · 运行中 ${counts.RUNNING||0}`;$('gpuUtil').textContent=gpu.utilization_percent==null?'-':`${n(gpu.utilization_percent,0)}%`;bar('gpuBar',gpu.utilization_percent||0);
  $('currentGrid').innerHTML=[kv('分组',c.group,true),kv('数据集',c.dataset),kv('模型',c.model),kv('方法',c.method),kv('Seed',c.seed),kv('阶段',c.phase),kv('最佳验证准确率',n(c.best_val_acc)),kv('最佳 Epoch',c.best_epoch),kv('当前 LR',c.lr_after??c.lr_before),kv('results_v2 完整结果',`${d.counts?.COMPLETED??0} / ${d.total||0}`),kv('配置',cs.config_path),kv('状态',cs.status)].join('');
  $('gpuGrid').innerHTML=[kv('设备',gpu.name),kv('显存',gpu.memory_used_mb==null?'-':`${n(gpu.memory_used_mb,0)} / ${n(gpu.memory_total_mb,0)} MB`),kv('温度',gpu.temperature_c==null?'-':`${n(gpu.temperature_c,0)} C`),kv('功耗',gpu.power_w==null?'-':`${n(gpu.power_w,0)} / ${n(gpu.power_limit_w,0)} W`),kv('利用率',gpu.utilization_percent==null?'-':`${n(gpu.utilization_percent,0)}%`),kv('采样时间',new Date(d.generated_at).toLocaleTimeString())].join('');
  $('groups').innerHTML=(d.groups||[]).map(g=>`<div class="group"><div class="group-head"><span>${g.name}</span><span>${g.completed}/${g.total}</span></div><div class="bar"><div class="fill" style="width:${pct(g.completed,g.total)}%"></div></div><div class="group-counts">运行 ${g.running} · 待处理 ${g.pending} · 失败 ${g.failed}</div></div>`).join('');
  $('metrics').innerHTML=[kv('Train loss',n(c.train_loss)),kv('Train acc',n(c.train_acc)),kv('Eval NLL',n(c.eval_nll)),kv('Eval acc',n(c.eval_acc)),kv('Val NLL',n(c.val_nll)),kv('Val acc',n(c.val_acc)),kv('Reliability rbar',n(c.rbar)),kv('LR before',n(c.lr_before)),kv('LR after',n(c.lr_after)),kv('Batch elapsed',c.batch_elapsed),kv('Epoch ETA',c.eta_epoch||c.eta_eval),kv('Best val',n(c.best_val_acc))].join('');
  const epochs=parseEpochs(cs.messages||[]);draw('accChart',[{name:'val_acc',values:epochs.map(x=>x.acc)}],'Accuracy',['#2563eb']);draw('lossChart',[{name:'val_nll',values:epochs.map(x=>x.loss)},{name:'rbar',values:epochs.map(x=>x.r)}],'Loss / Reliability',['#c53232','#087f72']);$('currentLog').textContent=(d.current_log||cs.messages||[]).slice(-160).join('\n');$('queueLog').textContent=[...(d.queue_log||[]),...(d.queue_errors||[])].slice(-160).join('\n');renderQueue();}
async function refresh(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error(r.status);render(await r.json())}catch(e){$('status').textContent='连接失败';$('dot').className='dot attention';$('updated').textContent=String(e)}}
for(const id of ['search','groupFilter','statusFilter'])$(id).addEventListener(id==='search'?'input':'change',renderQueue);['main','pd','budget','sigma','tiny_imagenet','deit_cifar100'].forEach(g=>$('groupFilter').insertAdjacentHTML('beforeend',`<option>${g}</option>`));addEventListener('resize',()=>latest.current_state&&render(latest));refresh();setInterval(refresh,2000);
</script>
</body></html>
